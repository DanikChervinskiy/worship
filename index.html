<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Команда прославления</title>
  <meta name="description" content="Песни с аккордами, расписание служений и команда прославления в одном приложении.">
  <meta name="theme-color" content="#ECECE9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Служение">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    body { margin: 0; font: 14px system-ui, -apple-system, sans-serif; }
    [hidden] { display: none !important; }
  </style>
  <link rel="stylesheet" href="css/app.css">
  <script src="firebase-config.js"></script>
</head>
<body>
  <div id="app">
    <main id="view">
      <div class="boot">
        <span class="boot-ring" aria-hidden="true"></span>
        <p>Загружаем команду…</p>
      </div>
    </main>
  </div>
  <nav id="tabbar" aria-label="Разделы"></nav>
  <div id="layer"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
  <script>
    setTimeout(function () {
      if (!window.__wtBooted) {
        var v = document.getElementById('view');
        if (v) v.textContent = 'Не удалось загрузить приложение. Обновите страницу.';
      }
    }, 9000);
  </script>
</body>
</html>
