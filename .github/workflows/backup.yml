name: Резервная копия

on:
  schedule:
    - cron: '41 0 * * *'   # каждую ночь (около 03:41 по Киеву)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKUP_REPO: ${{ vars.BACKUP_REPO }}
    steps:
      - name: Проверить настройки
        id: check
        run: |
          if [ -z "${{ secrets.BACKUP_TOKEN }}" ] || [ -z "$BACKUP_REPO" ]; then
            echo "Бэкап не настроен (нужны секрет BACKUP_TOKEN и переменная BACKUP_REPO) — пропускаю."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with:
          node-version: 20
      - name: Скачать приватный репозиторий для копий
        if: steps.check.outputs.skip != '1'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_TOKEN }}
          path: backup-repo
      - name: Установить зависимости
        if: steps.check.outputs.skip != '1'
        working-directory: scripts
        run: npm install --no-audit --no-fund --silent
      - name: Выгрузить базу
        if: steps.check.outputs.skip != '1'
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_DIR: ${{ github.workspace }}/backup-repo/backup
        run: node backup.mjs
      - name: Сохранить версию
        if: steps.check.outputs.skip != '1'
        working-directory: backup-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup
          git commit -q -m "Копия $(TZ=Europe/Kyiv date +%Y-%m-%d)" || { echo "Изменений нет"; exit 0; }
          git push -q
