name: Уведомления

on:
  schedule:
    - cron: '*/15 * * * *'   # каждые 15 минут (GitHub иногда запускает с задержкой)
    - cron: '17 3 * * 1'     # раз в неделю — отметка активности, чтобы GitHub не отключил расписание
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.schedule != '17 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Kyiv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установить зависимости
        working-directory: scripts
        run: npm install --no-audit --no-fund --silent
      - name: Разослать уведомления
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
        run: node notify.mjs

  keepalive:
    # GitHub отключает расписание в публичном репозитории после 60 дней без коммитов.
    # Раз в неделю обновляем служебный файл — расписание остаётся включённым.
    if: github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Отметка активности
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-run.txt
          git commit -m "Отметка активности" || exit 0
          git push
